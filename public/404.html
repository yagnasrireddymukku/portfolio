<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting | YagnaSri Reddy Mukku</title>
    <script type="text/javascript">
      (function() {
        var path = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;

        var segments = path.split('/').filter(Boolean);
        if (window.location.hostname.endsWith('github.io') && segments.length > 0) {
          var repo = segments[0];
          var route = segments.slice(1).join('/');
          window.location.replace('/' + repo + '/#/' + route + search + hash);
        } else {
          window.location.replace('/#/' + segments.join('/') + search + hash);
        }
      })();
    </script>
    <style>
      body {
        margin: 0;
        background-color: #070B14;
        color: #94A3B8;
        font-family: system-ui, -apple-system, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid rgba(56, 217, 255, 0.15);
        border-top-color: #38D9FF;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 16px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div style="text-align: center;">
      <div class="spinner" style="margin: 0 auto 16px;"></div>
      <p style="font-size: 14px; font-weight: 500;">Loading portfolio...</p>
    </div>
  </body>
</html>
