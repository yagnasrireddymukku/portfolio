<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#07090e" />
      <stop offset="100%" stop-color="#0e172a" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" rx="48" fill="url(#bgGrad)" />
  
  <!-- Subtle tech pattern lines -->
  <circle cx="200" cy="200" r="160" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="6,6" />
  <circle cx="200" cy="200" r="125" fill="none" stroke="#2563eb" stroke-opacity="0.2" stroke-width="2" />
  <circle cx="200" cy="200" r="95" fill="none" stroke="#00d2ff" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- Outer Rounded Border Glow -->
  <rect x="8" y="8" width="384" height="384" rx="42" fill="none" stroke="url(#borderGrad)" stroke-width="3" stroke-opacity="0.8" filter="url(#glow)" />

  <!-- Center Avatar Core -->
  <circle cx="200" cy="180" r="65" fill="#0f172a" stroke="url(#borderGrad)" stroke-width="3" />

  <!-- Silhouette Icon Representation -->
  <path d="M200 145 A25 25 0 0 1 200 195 A25 25 0 0 1 200 145 Z" fill="#38bdf8" />
  <path d="M150 250 C150 215 170 205 200 205 C230 205 250 215 250 250 Z" fill="#38bdf8" opacity="0.9" />

  <!-- Initials Badge -->
  <rect x="130" y="300" width="140" height="36" rx="18" fill="#0f172a" stroke="#00d2ff" stroke-width="1.5" />
  <text x="200" y="323" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14" text-anchor="middle" letter-spacing="2">
    YAGNASRI
  </text>
  <circle cx="145" cy="318" r="4" fill="#00d2ff" />
  <circle cx="255" cy="318" r="4" fill="#3b82f6" />
</svg>
